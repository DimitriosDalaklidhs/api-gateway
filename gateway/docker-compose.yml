version: "3.9"

services:

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      # Loopback only. This Redis has no password, and a port published
      # without an address is open on every interface of the host.
      - "127.0.0.1:6379:6379"
    command: redis-server --save "" --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── API Gateway ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Development placeholder. HS256 wants a key of at least 32 bytes.
      JWT_SECRET_KEY: "dev-only-secret-change-me-in-production"
    volumes:
      # Logs: `docker compose logs -f gateway`. The log file stays inside the
      # container; the image runs unprivileged and could not write to a host
      # directory that Docker creates as root.
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/admin/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mock downstream service ────────────────────────────────────────────────
  mock-service:
    build:
      context: .
      dockerfile: Dockerfile.mock
    restart: unless-stopped
    ports:
      # Loopback only: other machines reach the mock through the gateway
      - "127.0.0.1:8010:8010"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8010/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Redis Insight (optional GUI) ───────────────────────────────────────────
  redis-insight:
    image: redislabs/redisinsight:latest
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - redis
    profiles:
      - debug
