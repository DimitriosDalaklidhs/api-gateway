# ── Redis: PVC + Deployment + Service ────────────────────────────────────────
# NOTE: your compose runs redis with `--save ""` (persistence OFF). That is
# arguably correct for a rate-limiter/cache. Here it is ON (appendonly) so the
# PVC actually does something. See README "The Redis persistence question".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: gateway
  labels:
    app: redis
spec:
  replicas: 1
  strategy:
    # RWO volume can only be mounted by one node at a time. A RollingUpdate
    # would try to start the new pod before the old one releases the volume
    # and deadlock. Recreate = kill old, then start new.
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--loglevel", "warning"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: gateway
spec:
  type: ClusterIP
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
