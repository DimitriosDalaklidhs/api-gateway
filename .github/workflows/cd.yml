name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types:
      - completed

permissions:
  contents: read
  packages: write        # lets GITHUB_TOKEN push to GHCR, no extra secrets needed

jobs:
  publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push gateway image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE:gateway -t $IMAGE:gateway-${SHA::7} \
            -f gateway/Dockerfile gateway/
          docker push --all-tags $IMAGE

      - name: Build & push mock-service image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE:mock -t $IMAGE:mock-${SHA::7} \
            -f gateway/Dockerfile.mock gateway/
          docker push --all-tags $IMAGE
