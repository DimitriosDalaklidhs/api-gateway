name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types:
      - completed

permissions:
  contents: read
  packages: write        # lets GITHUB_TOKEN push to GHCR, no extra secrets needed

jobs:
  publish:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    # The `branches` filter above matches the branch the CI run came from, so a
    # pull request from a fork's branch named "main" passes it too. Publish only
    # pushes to this repository, never pull request code.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository

    steps:
      - name: Checkout the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Pinned to a commit: this step is handed the token that can push images
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push gateway image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE:gateway -t $IMAGE:gateway-${SHA::7} \
            -f gateway/Dockerfile gateway/
          docker push --all-tags $IMAGE

      - name: Build & push mock-service image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE:mock -t $IMAGE:mock-${SHA::7} \
            -f gateway/Dockerfile.mock gateway/
          docker push --all-tags $IMAGE

  deploy:
    name: Deploy to the cluster
    needs: publish
    runs-on: ubuntu-latest
    # Off until the repository variable DEPLOY_ENABLED is set to "true" and the
    # three DEPLOY_* secrets exist (README, "Automatic deploys").
    if: vars.DEPLOY_ENABLED == 'true'
    # This job only opens an SSH connection, so its token gets no permissions
    permissions: {}

    steps:
      # The key in DEPLOY_SSH_KEY is tied on the server to one command,
      # scripts/deploy.sh, and whatever is sent here reaches that script as its
      # argument. The script moves both Deployments to this commit's SHA tags,
      # waits for the new pods to become ready and rolls back if they don't,
      # which fails this job.
      - name: Roll the cluster to this commit's images
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET: ${{ secrets.DEPLOY_TARGET }}           # user@host
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}   # the server's host key, so it can't be impersonated
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$TARGET" "${SHA::7}"
